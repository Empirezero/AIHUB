{% extends "base.html" %}
{% block title %}Login — AIHub{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 400px;">
    <h2 class="mb-4">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-dark w-100">Log in</button>
    </form>
</div>
{% endblock %}
