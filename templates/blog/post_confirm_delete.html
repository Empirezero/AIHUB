{% extends "base.html" %}
{% block title %}Delete Post — AIHub{% endblock %}
{% block content %}
<div class="mx-auto text-center" style="max-width: 500px;">
    <h2>Delete "{{ post.title }}"?</h2>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'post-detail' post.slug %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
